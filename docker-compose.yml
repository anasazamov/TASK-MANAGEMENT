# Production stack: the web app, the reminder loop and MinIO for task files.
# PostgreSQL is not part of this stack: point DB_* in .env at your own server.
# Put the production values in .env (start from .env.production), then:
#   docker compose up -d --build
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    # The HTTPS proxy in front of the stack publishes the site; this port is local.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/app/media
      - ./logs:/app/logs

  reminders:
    build: .
    command: ["reminders"]
    restart: unless-stopped
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    # Files are served to browsers by the app, so only the console is published,
    # and only on localhost: reach it over SSH or behind the proxy.
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    restart: "no"
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
             mc mb --ignore-existing local/$$S3_BUCKET &&
             mc anonymous set none local/$$S3_BUCKET &&
             echo 'bucket tayyor:' $$S3_BUCKET"

volumes:
  media:
  minio-data:
